name: Reusable engine verification
on:
  workflow_call:
    inputs:
      source-sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source-sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.2'
          cache-dependency-path: go.sum
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Check Go formatting
        run: test -z "$(gofmt -l engine)"
      - name: Build one portable wasm32 release and native comparator
        env:
          ENGINE_SOURCE_SHA: ${{ inputs.source-sha }}
        run: npm run build
      - run: go test -modfile=build/go.mod -mod=readonly -tags=gms_pure_go ./engine
      - name: Install checksum-pinned native fixture tool
        run: node scripts/install-dolt.mjs
      - name: Generate native Dolt fixture and independent Beads baseline
        run: PATH="$PWD/.cache/dolt:$PATH" npm run fixture
      - name: Exercise production publisher with real release bytes and immutable replay
        run: node scripts/selftest-publication.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine-build
          path: |
            dist/
            build/browser-fixture/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: engine-build-evidence
          path: |
            build/publication-selftest.json
            build/fixture/server.log
          if-no-files-found: ignore
  browsers:
    needs: build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            browser: chromium
          - os: ubuntu-24.04
            browser: firefox
          - os: ubuntu-24.04
            browser: webkit
          - os: macos-latest
            browser: webkit
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source-sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: engine-build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify identical release bytes in this browser/host
        env:
          ENGINE_BROWSER: ${{ matrix.browser }}
          ENGINE_EXPECTED_SHA: ${{ inputs.source-sha }}
        run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-${{ matrix.os }}-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
